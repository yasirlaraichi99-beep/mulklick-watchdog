name: Relais du secours (toutes les 10 min)

# Passages automatiques du secours, toutes les 10 minutes, SANS service extérieur ni clé ajoutée :
# chaque passage relance le suivant (workflow_dispatch avec le jeton fourni par GitHub au passage).
# But : si Railway (donc le cockpit et sa surveillance) tombe, l'alerte part en 25 min au plus
# (15 min sans signe de vie du cockpit + 10 min entre deux passages). Dépôt public : coût nul.
# Cockpit vivant : le passage lit son signe de vie (et s'y signale par ?secours=1), relève sa boîte
# d'alertes (jeton OIDC GitHub) et livre ses messages par « Mulklick Alertes » ; si la boîte n'est
# pas relevable, il refait lui-même les contrôles du site. Le cockpit, lui, prévient Yasir si le secours ne passe plus.
#
# Robustesse de la chaîne :
# - le cron ne sert qu'à la relancer si elle a cassé ; son contrôle tourne HORS du groupe de
#   concurrence, il ne peut donc ni attendre ni annuler un passage de la chaîne ;
# - deux chaînes ne peuvent pas coexister : le groupe « watchdog » n'admet qu'un passage en cours
#   et un en attente (un nouveau passage en attente annule l'ancien), elles fusionnent d'elles-mêmes.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read
  actions: write

jobs:
  chaine:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      vivante: ${{ steps.verif.outputs.vivante }}
    steps:
      - name: Chaîne déjà vivante ? (lancement par le cron seulement)
        id: verif
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Passages du relais encore en cours ou en attente, lancés avant celui-ci.
          actifs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow relais.yml --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId < $GITHUB_RUN_ID)] | length") || actifs=0
          if [ "${actifs:-0}" -gt 0 ]; then
            echo "vivante=oui" >> "$GITHUB_OUTPUT"
            echo "Chaîne vivante : ce lancement du cron s'arrête là."
          else
            echo "Chaîne arrêtée (ou état illisible) : ce lancement la relance."
          fi

  relais:
    needs: chaine
    if: needs.chaine.outputs.vivante != 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # id-token: write = le passage peut demander à GitHub un jeton OIDC (audience du cockpit) pour
    # relever la boîte d'alertes du cockpit ; aucun secret partagé. actions: write = relancer la chaîne.
    permissions:
      contents: read
      actions: write
      id-token: write
    # Même groupe que watchdog.yml : un seul passage à la fois sur l'état anti-spam partagé.
    concurrency:
      group: watchdog
      cancel-in-progress: false
    steps:
      - name: Récupérer le script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Relire l'état précédent (anti-spam)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-state
          key: watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watchdog-state-

      # ACTIONS_ID_TOKEN_REQUEST_URL et ACTIONS_ID_TOKEN_REQUEST_TOKEN sont fournis par le runner à
      # chaque étape (grâce à id-token: write) ; le script les lit, ne les affiche jamais.
      - name: Secours (cockpit vivant ? boîte d'alertes relevée ; sinon contrôles A à D)
        run: node watchdog.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRINCIPAL_HEALTH_URL: ${{ secrets.PRINCIPAL_HEALTH_URL }}
          WATCHDOG_TEST: 'false'
          WATCHDOG_STATE_FILE: .watchdog-state/state.json

      - name: Mémoriser l'état
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .watchdog-state
          key: watchdog-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Attendre 10 min, puis relancer le passage suivant
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 540
          for essai in 1 2 3; do
            if gh workflow run relais.yml -R "$GITHUB_REPOSITORY" --ref main; then exit 0; fi
            sleep 20
          done
          echo "Relance impossible après 3 essais : le cron relancera la chaîne."
          exit 1
